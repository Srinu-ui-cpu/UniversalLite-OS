name: Build UniversalLite OS

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      arch:
        description: 'Target architecture'
        type: choice
        options: [amd64, arm64, armhf]
        default: 'amd64'
      variant:
        description: 'Build variant'
        type: choice
        options: [ultra-lite, balanced, performance]
        default: 'balanced'
      distribution:
            description: 'Debian distribution'
            type: choice
            options: [trixie, bookworm]
            default: 'bookworm'
      sign:
        description: 'Sign ISO with GPG'
        type: boolean
        default: false

env:
  DEBIAN_FRONTEND: noninteractive
  LB_APT_HTTP_PROXY: ""
  LB_APT_FTP_PROXY: ""

jobs:
  build-amd64:
    name: Build AMD64 (${{ matrix.variant }})
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.arch == 'amd64'
    strategy:
      fail-fast: false
      matrix:
        variant: [ultra-lite, balanced, performance]
        distribution: [bookworm]
        include:
          - variant: ultra-lite
            ram_target: "73MB"
          - variant: balanced
            ram_target: "134MB"
          - variant: performance
            ram_target: "158MB"
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends software-properties-common
          sudo add-apt-repository -y universe
          sudo apt-get update
          # Install core packages + live-build from Ubuntu universe
          sudo apt-get install -y --no-install-recommends \
            xorriso \
            grub-efi-amd64 \
            grub-pc \
            dosfstools \
            mtools \
            efibootmgr \
            curl \
            wget \
            git \
            python3 \
            python3-pip \
            nodejs \
            npm \
            qemu-user-static \
            binfmt-support \
            debootstrap \
            squashfs-tools \
            zstd \
            live-build \
            erofs-utils \
            b3sum || echo "Some packages may need manual install, continuing..."
          # Verify installations
          lb --version && echo "live-build OK" || echo "WARNING: lb not available"
          mkfs.erofs --version && echo "erofs-utils OK" || echo "WARNING: erofs-utils not available"
          b3sum --version && echo "b3sum OK" || echo "WARNING: b3sum not available"
      
      - name: Enable binfmt for cross-compilation
        run: |
          # Ensure qemu-user-static is installed
          if ! command -v qemu-aarch64-static &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y qemu-user-static binfmt-support
          fi
          # Mount binfmt_misc if not mounted
          if ! mount | grep -q binfmt_misc; then
            sudo mount -t binfmt_misc binfmt_misc /proc/sys/fs/binfmt_misc 2>/dev/null || true
          fi
          # Register binfmt entries if not already registered (using systemd-binfmt if available)
          if [ -f /usr/lib/systemd/systemd-binfmt ]; then
            sudo /usr/lib/systemd/systemd-binfmt 2>/dev/null || true
          fi
          # Fallback: manual registration
          if [ ! -f /proc/sys/fs/binfmt_misc/qemu-aarch64 ]; then
            echo ':qemu-aarch64:M::\x7fELF\x02\x01\x01\x00\x00\x00\x00\x00\x00\x00\x00\x00\x02\x00\xb7\x00:\xff\xff\xff\xff\xff\xff\xff\x00\xff\xff\xff\xff\xff\xff\xff\xff\xfe\xff\xff\xff:/usr/bin/qemu-aarch64-static:OCF' | sudo tee /proc/sys/fs/binfmt_misc/register 2>/dev/null || true
          fi
          if [ ! -f /proc/sys/fs/binfmt_misc/qemu-arm ]; then
            echo ':qemu-arm:M::\x7fELF\x01\x01\x01\x00\x00\x00\x00\x00\x00\x00\x00\x00\x02\x00\x28\x00:\xff\xff\xff\xff\xff\xff\xff\x00\xff\xff\xff\xff\xff\xff\xff\xff\xfe\xff\xff\xff:/usr/bin/qemu-arm-static:OCF' | sudo tee /proc/sys/fs/binfmt_misc/register 2>/dev/null || true
          fi
          # Enable if registered
          sudo update-binfmts --enable qemu-aarch64 2>/dev/null || true
          sudo update-binfmts --enable qemu-arm 2>/dev/null || true
          # Verify
          ls -la /proc/sys/fs/binfmt_misc/ | grep qemu || echo "qemu binfmt entries not found, but continuing..."
        continue-on-error: true
      
      - name: Cache live-build
        uses: actions/cache@v4
        with:
          path: |
            /var/cache/apt/archives
            ~/.cache/live-build
          key: live-build-${{ runner.os }}-${{ matrix.variant }}-${{ hashFiles('build/live-build/config/package-lists/**') }}
          restore-keys: |
            live-build-${{ runner.os }}-${{ matrix.variant }}-
      
      - name: Configure live-build
        run: |
          cd build/live-build
          sudo ./auto/build \
            --arch amd64 \
            --distribution ${{ matrix.distribution }} \
            --variant ${{ matrix.variant }}
        env:
          ARCH: amd64
          DISTRIBUTION: ${{ matrix.distribution }}
          VARIANT: ${{ matrix.variant }}
      
      - name: Build ISO
        run: |
          cd build/live-build
          sudo lb build
        env:
          ARCH: amd64
          DISTRIBUTION: ${{ matrix.distribution }}
          VARIANT: ${{ matrix.variant }}
      
      - name: Create hybrid ISO
        run: |
          cd build/live-build
          sudo ../scripts/create-hybrid-iso.sh amd64 ${{ matrix.distribution }} ${{ matrix.variant }}
      
      - name: Test boot in QEMU
        run: |
          cd build/live-build
          sudo ../scripts/test-boot.sh amd64 ${{ matrix.variant }} ${{ matrix.ram_target }}
        continue-on-error: true
      
      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: universalite-${{ matrix.distribution }}-amd64-${{ matrix.variant }}
          path: build/images/universalite-${{ matrix.distribution }}-amd64-${{ matrix.variant }}*.iso*
          retention-days: 30
      
      - name: Generate checksums
        run: |
          cd build/images
          for f in universalite-${{ matrix.distribution }}-amd64-${{ matrix.variant }}*.iso; do
            sha256sum "$f" > "$f.sha256"
            sha512sum "$f" > "$f.sha512"
          done
          ls -la
      
      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: universalite-${{ matrix.distribution }}-amd64-${{ matrix.variant }}-checksums
          path: build/images/universalite-${{ matrix.distribution }}-amd64-${{ matrix.variant }}*.sha*
          retention-days: 30

  build-arm64:
    name: Build ARM64 (${{ matrix.variant }})
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.arch == 'arm64'
    strategy:
