          path: build/images/universalite-${{ matrix.distribution }}-armhf-${{ matrix.variant }}*.sha*
          retention-days: 30

  test-matrix:
    name: Test Matrix
    needs: [build-amd64, build-arm64, build-armhf]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 60
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: universalite-*
      
      - name: List artifacts
        run: |
          find artifacts -type f -name "*.iso" -o -name "*.img*" -o -name "*.sha*" | sort
          echo "Total ISOs: $(find artifacts -name "*.iso" | wc -l)"
          echo "Total disk images: $(find artifacts -name "*.img*" | wc -l)"
      
      - name: Verify checksums
        run: |
          cd artifacts
          for f in *.sha256; do
            echo "Verifying $f..."
            sha256sum -c "$f" || exit 1
          done
          echo "All checksums verified!"
      
      - name: Test boot all ISOs
        run: |
          for iso in artifacts/*.iso; do
            echo "Testing $iso..."
            timeout 60 qemu-system-x86_64 -m 1G -cdrom "$iso" -nographic -no-reboot || true
          done
        continue-on-error: true

  release:
    name: Create Release
    needs: [build-amd64, build-arm64, build-armhf, test-matrix]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: universalite-*
      
      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          cp artifacts/**/*.iso release-assets/ 2>/dev/null || true
          cp artifacts/**/*.img.xz release-assets/ 2>/dev/null || true
          cp artifacts/**/*.sha256 release-assets/ 2>/dev/null || true
          cp artifacts/**/*.sha512 release-assets/ 2>/dev/null || true
          ls -la release-assets/
      
      - name: Generate release notes
        run: |
          cat > release-notes.md << 'RELEASEEOF'
          # UniversalLite OS ${{ github.ref_name }}
          
          ## Downloads
          
          ### AMD64 (x86_64)
          | Variant | ISO | Checksums |
          |---------|-----|-----------|
          RELEASEEOF
          
          for variant in ultra-lite balanced performance; do
            iso=$(find release-assets -name "*amd64-${variant}*.iso" | head -1)
            if [[ -n "$iso" ]]; then
              sha=$(cat "${iso}.sha256" | cut -d' ' -f1)
              echo "| $variant | [${iso##*/}](${iso##*/}) | SHA256: \`${sha}\` |" >> release-notes.md
            fi
          done
          
          cat >> release-notes.md << 'RELEASEEOF'
          
          ### ARM64 (AArch64)
          | Variant | ISO | Disk Image | Checksums |
          |---------|-----|------------|-----------|
          RELEASEEOF
          
          for variant in ultra-lite balanced performance; do
            iso=$(find release-assets -name "*arm64-${variant}*.iso" | head -1)
            img=$(find release-assets -name "*arm64-${variant}*.img.xz" | head -1)
            if [[ -n "$iso" || -n "$img" ]]; then
              iso_name=${iso##*/}
              img_name=${img##*/}
              sha=$(cat "${iso}.sha256" 2>/dev/null | cut -d' ' -f1 || echo "N/A")
              echo "| $variant | [${iso_name}](${iso_name}) | [${img_name}](${img_name}) | SHA256: \`${sha}\` |" >> release-notes.md
            fi
          done
          
          cat >> release-notes.md << 'RELEASEEOF'
          
          ### ARMhf (ARM 32-bit)
          | Variant | ISO | Disk Image | Checksums |
          |---------|-----|------------|-----------|
          RELEASEEOF
          
          for variant in ultra-lite balanced; do
            iso=$(find release-assets -name "*armhf-${variant}*.iso" | head -1)
            img=$(find release-assets -name "*armhf-${variant}*.img.xz" | head -1)
            if [[ -n "$iso" || -n "$img" ]]; then
              iso_name=${iso##*/}
              img_name=${img##*/}
              sha=$(cat "${iso}.sha256" 2>/dev/null | cut -d' ' -f1 || echo "N/A")
              echo "| $variant | [${iso_name}](${iso_name}) | [${img_name}](${img_name}) | SHA256: \`${sha}\` |" >> release-notes.md
            fi
          done
          
          cat >> release-notes.md << 'RELEASEEOF'
          
          ## Installation
          
          ### Live USB (Universal)
          ```bash
          # Write ISO to USB drive
          sudo dd if=universalite-*.iso of=/dev/sdX bs=4M status=progress && sync
          ```
          
          ### ARM Devices (Raspberry Pi, etc.)
          ```bash
          # Decompress and write disk image
          xzcat universalite-*.img.xz | sudo dd of=/dev/sdX bs=4M status=progress && sync
          ```
          
          ## Features
          
          - **Ultra Lite**: ~73MB RAM idle, minimal services
          - **Balanced**: ~134MB RAM idle, recommended for daily use
          - **Performance**: ~158MB RAM idle, full features
          
          All variants include:
          - Windows app support via UniversalBridge (Wine + Box86/Box64 + DXVK/VKD3D)
          - Android app support via Waydroid
          - Universal App Center (APT, Flatpak, Windows, Android, Web)
          - Optional AI Assistant (socket-activated, zero memory when idle)
          - Secure Boot support
          - Automatic updates with rollback
          
          ## System Requirements
          
          - **Minimum**: 1 GB RAM, 8 GB storage, x86_64 or ARM64/ARMhf CPU
          - **Recommended**: 2 GB RAM, 16 GB storage
          - **Boot**: UEFI or BIOS (CSM)
          
          ## Known Issues
          
          - Waydroid requires kernel with binder/ashmem (included)
          - Some Windows apps need specific Wine prefixes (configured per-app)
          - ARM64 Windows apps require Box64 (included)
          - Secure Boot keys are test keys - replace for production
          
          ## Verification
          
          Verify downloads:
          ```bash
          sha256sum -c universalite-*.sha256
          ```
          
          GPG signatures available for signed releases.
          RELEASEEOF
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: UniversalLite OS ${{ github.ref_name }}
          body_path: release-notes.md
          files: release-assets/*
          draft: false
          prerelease: ${{ contains(github.ref_name, 'rc') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify:
    name: Notify
    needs: [build-amd64, build-arm64, build-armhf]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Build status
        run: |
          echo "Build completed with status: ${{ needs.build-amd64.result }}, ${{ needs.build-arm64.result }}, ${{ needs.build-armhf.result }}"
      
      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number
            });
            
            const body = `## UniversalLite OS Build Results
            
            | Architecture | Variant | Status |
            |-------------|---------|--------|
            | AMD64 | ultra-lite | ${{ needs.build-amd64.result }} |
            | AMD64 | balanced | ${{ needs.build-amd64.result }} |
            | AMD64 | performance | ${{ needs.build-amd64.result }} |
            | ARM64 | ultra-lite | ${{ needs.build-arm64.result }} |
            | ARM64 | balanced | ${{ needs.build-arm64.result }} |
            | ARM64 | performance | ${{ needs.build-arm64.result }} |
            | ARMhf | ultra-lite | ${{ needs.build-armhf.result }} |
            | ARMhf | balanced | ${{ needs.build-armhf.result }} |
            
            Artifacts available for 30 days.`;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body
            });