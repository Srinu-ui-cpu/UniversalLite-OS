name: Build UniversalLite OS (Debian Containers)

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      arch:
        description: 'Target architecture'
        type: choice
        options: [amd64, arm64, armhf]
        default: 'amd64'
      variant:
        description: 'Build variant'
        type: choice
        options: [ultra-lite, balanced, performance]
        default: 'balanced'
      distribution:
        description: 'Debian distribution'
        type: choice
        options: [bookworm, trixie]
        default: 'bookworm'
      sign:
        description: 'Sign ISO with GPG'
        type: boolean
        default: false

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  build-amd64:
    name: Build AMD64 (${{ matrix.variant }})
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.arch == 'amd64'
    strategy:
      fail-fast: false
      matrix:
        variant: [ultra-lite, balanced, performance]
        distribution: [bookworm]
        include:
          - variant: ultra-lite
            ram_target: "73MB"
          - variant: balanced
            ram_target: "134MB"
          - variant: performance
            ram_target: "158MB"
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Build in Debian container
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace/build/live-build \
            -e ARCH=amd64 \
            -e DISTRIBUTION=${{ matrix.distribution }} \
            -e VARIANT=${{ matrix.variant }} \
            debian:bookworm-slim bash -c '
              apt-get update &&
              apt-get install -y --no-install-recommends \
                live-build xorriso grub-efi-amd64 grub-pc dosfstools mtools \
                efibootmgr curl wget git python3 python3-pip nodejs npm \
                qemu-user-static binfmt-support debootstrap squashfs-tools \
                zstd erofs-utils b3sum &&
              ln -sf /usr/share/live-build/auto/build auto/build &&
              chmod +x auto/build &&
              ./auto/build --arch amd64 --distribution ${{ matrix.distribution }} --variant ${{ matrix.variant }}
            '
      
      - name: Build ISO
        run: |
          cd build/live-build
          docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace/build/live-build debian:bookworm-slim lb build
      
      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: universalite-${{ matrix.distribution }}-amd64-${{ matrix.variant }}
          path: build/images/universalite-${{ matrix.distribution }}-amd64-${{ matrix.variant }}*.iso*
          retention-days: 30
      
      - name: Generate checksums
        run: |
          cd build/images
          for f in universalite-${{ matrix.distribution }}-amd64-${{ matrix.variant }}*.iso; do
            sha256sum "$f" > "$f.sha256"
            sha512sum "$f" > "$f.sha512"
          done
      
      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: universalite-${{ matrix.distribution }}-amd64-${{ matrix.variant }}-checksums
          path: build/images/universalite-${{ matrix.distribution }}-amd64-${{ matrix.variant }}*.sha*
          retention-days: 30

  build-arm64:
    name: Build ARM64 (${{ matrix.variant }})
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.arch == 'arm64'
    strategy:
      fail-fast: false
      matrix:
        variant: [ultra-lite, balanced, performance]
        distribution: [bookworm]
        include:
          - variant: ultra-lite
            ram_target: "73MB"
          - variant: balanced
            ram_target: "134MB"
          - variant: performance
            ram_target: "158MB"
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Build in Debian container (cross-compile)
        run: |
          docker run --rm --privileged \
            -v /proc:/proc-host \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace/build/live-build \
            -e ARCH=arm64 \
            -e DISTRIBUTION=${{ matrix.distribution }} \
            -e VARIANT=${{ matrix.variant }} \
            debian:bookworm-slim bash -c '
              apt-get update &&
              apt-get install -y --no-install-recommends \
                live-build xorriso grub-efi-arm64 grub-efi-amd64 dosfstools mtools \
                efibootmgr curl wget git python3 python3-pip nodejs npm \
                qemu-user-static binfmt-support debootstrap squashfs-tools \
                zstd gcc-aarch64-linux-gnu g++-aarch64-linux-gnu u-boot-tools \
                device-tree-compiler erofs-utils b3sum &&
              ln -sf /usr/share/live-build/auto/build auto/build &&
              chmod +x auto/build &&
              ./auto/build --arch arm64 --distribution ${{ matrix.distribution }} --variant ${{ matrix.variant }}
            '
      
      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: universalite-${{ matrix.distribution }}-arm64-${{ matrix.variant }}
          path: build/images/universalite-${{ matrix.distribution }}-arm64-${{ matrix.variant }}*.iso*
          retention-days: 30
      
      - name: Upload ARM disk image
        uses: actions/upload-artifact@v4
        with:
          name: universalite-${{ matrix.distribution }}-arm64-${{ matrix.variant }}-disk
          path: build/images/universalite-${{ matrix.distribution }}-arm64-${{ matrix.variant }}*.img*
          retention-days: 30
      
      - name: Generate checksums
        run: |
          cd build/images
          for f in universalite-${{ matrix.distribution }}-arm64-${{ matrix.variant }}*.iso; do
            sha256sum "$f" > "$f.sha256"
          done
          for f in universalite-${{ matrix.distribution }}-arm64-${{ matrix.variant }}*.img*; do
            sha256sum "$f" > "$f.sha256"
          done

  build-armhf:
    name: Build ARMhf (${{ matrix.variant }})
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.arch == 'armhf'
    strategy:
      fail-fast: false
      matrix:
        variant: [ultra-lite, balanced]
        distribution: [bookworm]
        include:
          - variant: ultra-lite
            ram_target: "64MB"
          - variant: balanced
            ram_target: "96MB"
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Build in Debian container (cross-compile)
        run: |
          docker run --rm --privileged \
            -v /proc:/proc-host \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace/build/live-build \
            -e ARCH=armhf \
            -e DISTRIBUTION=${{ matrix.distribution }} \
            -e VARIANT=${{ matrix.variant }} \
            debian:bookworm-slim bash -c '
              apt-get update &&
              apt-get install -y --no-install-recommends \
                live-build xorriso grub-efi-arm64 grub-efi-amd64 dosfstools mtools \
                efibootmgr curl wget git python3 python3-pip nodejs npm \
                qemu-user-static binfmt-support debootstrap squashfs-tools \
                zstd gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf u-boot-tools \
                device-tree-compiler erofs-utils b3sum &&
              ln -sf /usr/share/live-build/auto/build auto/build &&
              chmod +x auto/build &&
              ./auto/build --arch armhf --distribution ${{ matrix.distribution }} --variant ${{ matrix.variant }}
            '
      
      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: universalite-${{ matrix.distribution }}-armhf-${{ matrix.variant }}
          path: build/images/universalite-${{ matrix.distribution }}-armhf-${{ matrix.variant }}*.iso*
          retention-days: 30
      
      - name: Upload ARM disk image
        uses: actions/upload-artifact@v4
        with:
          name: universalite-${{ matrix.distribution }}-armhf-${{ matrix.variant }}-disk
          path: build/images/universalite-${{ matrix.distribution }}-armhf-${{ matrix.variant }}*.img*
          retention-days: 30
      
      - name: Generate checksums
        run: |
          cd build/images
          for f in universalite-${{ matrix.distribution }}-armhf-${{ matrix.variant }}*.iso; do
            sha256sum "$f" > "$f.sha256"
          done
          for f in universalite-${{ matrix.distribution }}-armhf-${{ matrix.variant }}*.img*; do
            sha256sum "$f" > "$f.sha256"
          done

  test-matrix:
    name: Test Matrix
    needs: [build-amd64, build-arm64, build-armhf]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 60
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: universalite-*
      
      - name: List artifacts
        run: |
          find artifacts -type f \( -name "*.iso" -o -name "*.img*" -o -name "*.sha*" \) | sort
          echo "Total ISOs: $(find artifacts -name "*.iso" | wc -l)"
      
      - name: Test boot all ISOs
        run: |
          for iso in artifacts/*.iso; do
            echo "Testing $iso..."
            timeout 60 qemu-system-x86_64 -m 1G -cdrom "$iso" -nographic -no-reboot || true
          done
        continue-on-error: true

  release:
    name: Create Release
    needs: [build-amd64, build-arm64, build-armhf, test-matrix]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: universalite-*
      
      - name: Create release notes
        run: |
          echo "# UniversalLite OS ${{ github.ref_name }}" > release-notes.md
          echo "" >> release-notes.md
          echo "## Build Status: SUCCESS" >> release-notes.md
          echo "" >> release-notes.md
          echo "### Download Links" >> release-notes.md
          for variant in ultra-lite balanced performance; do
            echo "- **$variant**: \`universalite-*.iso\` artifacts available" >> release-notes.md
          done
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: UniversalLite OS ${{ github.ref_name }}
          body_path: release-notes.md
          files: artifacts/*
          draft: false
          prerelease: ${{ contains(github.ref_name, 'rc') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify:
    name: Notify
    needs: [build-amd64, build-arm64, build-armhf]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Build status
        run: |
          echo "Build completed with status: ${{ needs.build-amd64.result }}, ${{ needs.build-arm64.result }}, ${{ needs.build-armhf.result }}"