          fi
          # Mount binfmt_misc if not mounted
          if ! mount | grep -q binfmt_misc; then
            sudo mount -t binfmt_misc binfmt_misc /proc/sys/fs/binfmt_misc 2>/dev/null || true
          fi
          # Register binfmt entries if not already registered (using systemd-binfmt if available)
          if [ -f /usr/lib/systemd/systemd-binfmt ]; then
            sudo /usr/lib/systemd/systemd-binfmt 2>/dev/null || true
          fi
          # Fallback: manual registration
          if [ ! -f /proc/sys/fs/binfmt_misc/qemu-aarch64 ]; then
            echo ':qemu-aarch64:M::\x7fELF\x02\x01\x01\x00\x00\x00\x00\x00\x00\x00\x00\x00\x02\x00\xb7\x00:\xff\xff\xff\xff\xff\xff\xff\x00\xff\xff\xff\xff\xff\xff\xff\xff\xfe\xff\xff\xff:/usr/bin/qemu-aarch64-static:OCF' | sudo tee /proc/sys/fs/binfmt_misc/register 2>/dev/null || true
          fi
          if [ ! -f /proc/sys/fs/binfmt_misc/qemu-arm ]; then
            echo ':qemu-arm:M::\x7fELF\x01\x01\x01\x00\x00\x00\x00\x00\x00\x00\x00\x00\x02\x00\x28\x00:\xff\xff\xff\xff\xff\xff\xff\x00\xff\xff\xff\xff\xff\xff\xff\xff\xfe\xff\xff\xff:/usr/bin/qemu-arm-static:OCF' | sudo tee /proc/sys/fs/binfmt_misc/register 2>/dev/null || true
          fi
          # Enable if registered
          sudo update-binfmts --enable qemu-aarch64 2>/dev/null || true
          sudo update-binfmts --enable qemu-arm 2>/dev/null || true
          # Verify
          ls -la /proc/sys/fs/binfmt_misc/ | grep qemu || echo "qemu binfmt entries not found, but continuing..."
        continue-on-error: true
      
      - name: Cache live-build
        uses: actions/cache@v4
        with:
