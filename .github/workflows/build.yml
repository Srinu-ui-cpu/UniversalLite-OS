          mkfs.erofs --version && echo "erofs-utils OK" || echo "WARNING: erofs-utils not available"
          b3sum --version && echo "b3sum OK" || echo "WARNING: b3sum not available"
      
      - name: Enable binfmt for cross-compilation
        run: |
          sudo update-binfmts --enable qemu-arm 2>/dev/null || echo "binfmt enable failed, continuing..."
      
      - name: Cache live-build
        uses: actions/cache@v4
        with:
          path: |
            /var/cache/apt/archives
            ~/.cache/live-build
          key: live-build-${{ runner.os }}-armhf-${{ matrix.variant }}-${{ hashFiles('build/live-build/config/package-lists/**') }}
          restore-keys: |
            live-build-${{ runner.os }}-armhf-${{ matrix.variant }}-
      
      - name: Configure live-build
        run: |
          cd build/live-build
          sudo ./auto/build \
            --arch armhf \
            --distribution ${{ matrix.distribution }} \
            --variant ${{ matrix.variant }}
        env:
          ARCH: armhf
          DISTRIBUTION: ${{ matrix.distribution }}
          VARIANT: ${{ matrix.variant }}
      
      - name: Build ISO
        run: |
          cd build/live-build
          sudo lb build
        env:
          ARCH: armhf
          DISTRIBUTION: ${{ matrix.distribution }}
          VARIANT: ${{ matrix.variant }}
      
      - name: Create hybrid ISO
        run: |
          cd build/live-build
          sudo ../scripts/create-hybrid-iso.sh armhf ${{ matrix.distribution }} ${{ matrix.variant }}
      
      - name: Create ARM disk image
        run: |
          cd build/live-build
          sudo ../scripts/create-arm-image.sh armhf ${{ matrix.distribution }} ${{ matrix.variant }}
      
      - name: Test boot in QEMU (ARMhf)
        run: |
          cd build/live-build
          sudo ../scripts/test-boot.sh armhf ${{ matrix.variant }} ${{ matrix.ram_target }}
        continue-on-error: true
      
      - name: Upload ISO artifact
