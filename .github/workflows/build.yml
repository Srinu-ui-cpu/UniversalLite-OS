            grub-efi-amd64 \
            dosfstools \
            mtools \
            efibootmgr \
            curl \
            wget \
            git \
            python3 \
            python3-pip \
            nodejs \
            npm \
            qemu-user-static \
            binfmt-support \
            debootstrap \
            squashfs-tools \
            zstd \
            gcc-arm-linux-gnueabihf \
            g++-arm-linux-gnueabihf \
            u-boot-tools \
            device-tree-compiler \
            live-build \
            erofs-utils \
            b3sum || echo "Some packages may need manual install, continuing..."
          # Verify installations
