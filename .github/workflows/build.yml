        run: |
          cd build/live-build
          sudo ../scripts/create-hybrid-iso.sh arm64 ${{ matrix.distribution }} ${{ matrix.variant }}
      
      - name: Create ARM disk image
        run: |
          cd build/live-build
          sudo ../scripts/create-arm-image.sh arm64 ${{ matrix.distribution }} ${{ matrix.variant }}
      
      - name: Test boot in QEMU (ARM64)
        run: |
          cd build/live-build
          sudo ../scripts/test-boot.sh arm64 ${{ matrix.variant }} ${{ matrix.ram_target }}
        continue-on-error: true
      
      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: universalite-${{ matrix.distribution }}-arm64-${{ matrix.variant }}
          path: build/images/universalite-${{ matrix.distribution }}-arm64-${{ matrix.variant }}*.iso*
          retention-days: 30
      
      - name: Upload ARM disk image
        uses: actions/upload-artifact@v4
        with:
          name: universalite-${{ matrix.distribution }}-arm64-${{ matrix.variant }}-disk
          path: build/images/universalite-${{ matrix.distribution }}-arm64-${{ matrix.variant }}*.img*
          retention-days: 30
      
      - name: Generate checksums
        run: |
          cd build/images
          for f in universalite-${{ matrix.distribution }}-arm64-${{ matrix.variant }}*.iso; do
