      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: universalite-${{ matrix.distribution }}-arm64-${{ matrix.variant }}-checksums
          path: build/images/universalite-${{ matrix.distribution }}-arm64-${{ matrix.variant }}*.sha*
          retention-days: 30

  build-armhf:
    name: Build ARMhf (${{ matrix.variant }})
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.arch == 'armhf'
    strategy:
      fail-fast: false
      matrix:
        variant: [ultra-lite, balanced]
        distribution: [trixie]
        include:
          - variant: ultra-lite
            ram_target: "64MB"
          - variant: balanced
            ram_target: "96MB"
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends software-properties-common
          sudo add-apt-repository -y universe
          sudo apt-get update
          # Install core packages + live-build from Ubuntu universe
          sudo apt-get install -y --no-install-recommends \
