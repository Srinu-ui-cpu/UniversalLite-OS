          # Install core packages + live-build from Ubuntu universe
          sudo apt-get install -y --no-install-recommends \
            xorriso \
            grub-efi-arm64 \
            grub-efi-amd64 \
            dosfstools \
            mtools \
            efibootmgr \
            curl \
            wget \
            git \
            python3 \
            python3-pip \
            nodejs \
            npm \
            qemu-user-static \
            binfmt-support \
            debootstrap \
            squashfs-tools \
            zstd \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            u-boot-tools \
            device-tree-compiler \
            live-build \
            erofs-utils \
            b3sum || echo "Some packages may need manual install, continuing..."
          # Verify installations
          lb --version && echo "live-build OK" || echo "WARNING: lb not available"
          mkfs.erofs --version && echo "erofs-utils OK" || echo "WARNING: erofs-utils not available"
          b3sum --version && echo "b3sum OK" || echo "WARNING: b3sum not available"
      
      - name: Enable binfmt for cross-compilation
        run: |
          # Ensure qemu-user-static is installed
          if ! command -v qemu-aarch64-static &> /dev/null; then
